name: build MtkSystemUI (r77)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'build.sh', '.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # The base APK is not stored in git. Upload it once as an asset of a release tagged "base":
      #   gh release create base MtkSystemUI_R77_volumefix_9b2c33b3.apk -t "base APK (r77 + volume fix)"
      - name: fetch base apk
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release download base -p 'MtkSystemUI_R77_volumefix_9b2c33b3.apk' -D input
      - run: ./build.sh input/MtkSystemUI_R77_volumefix_9b2c33b3.apk out
      - uses: actions/upload-artifact@v4
        with:
          name: MtkSystemUI-r77
          path: out/
